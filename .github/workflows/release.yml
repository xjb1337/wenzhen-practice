name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.0'
        required: true
        type: string
      version_code:
        description: 'versionCode（整数）'
        required: true
        default: '1'
        type: string
      release_notes:
        description: '发布说明（支持多行）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version 必须为 X.Y.Z"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code 必须为整数"; exit 1; }
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then echo "tag v$VERSION 已存在"; exit 1; fi
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 未配置"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PversionName="${{ inputs.version }}" -PversionCode="${{ inputs.version_code }}" --stacktrace
      - name: Verify signature and checksum
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/wenzhen-practice.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs dist/wenzhen-practice.apk)
          echo "$OUT"
          CERT=$(echo "$OUT" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ -n "$EXPECTED_CERT" ]; then test "$CERT" = "$(echo "$EXPECTED_CERT" | tr 'A-F' 'a-f')" || { echo "签名证书不一致"; exit 1; }; fi
          (cd dist && sha256sum wenzhen-practice.apk > wenzhen-practice.apk.sha256)
          cat dist/wenzhen-practice.apk.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="v${{ inputs.version }}"
          printf '%s\n\nSHA-256: `%s`\n' "${NOTES:-版本 ${{ inputs.version }}}" "$(cut -d' ' -f1 dist/wenzhen-practice.apk.sha256)" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/wenzhen-practice.apk dist/wenzhen-practice.apk.sha256 \
            --target "$GITHUB_SHA" --title "问诊练习 $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
