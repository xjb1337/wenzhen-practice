name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.0'
        required: true
        type: string
      version_code:
        description: 'versionCode（整数）'
        required: true
        default: '6'
        type: string
      release_notes:
        description: '发布说明（支持多行）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version 必须为 X.Y.Z"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code 必须为整数"; exit 1; }
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then echo "tag v$VERSION 已存在"; exit 1; fi
          PREV_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          PREV_CODE=0
          if [ -n "$PREV_TAG" ]; then
            PREV_JSON=$(gh release download "$PREV_TAG" -p update.json -O - 2>/dev/null || true)
            PREV_CODE=$(printf '%s' "$PREV_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("versionCode",0))' 2>/dev/null || echo 0)
          fi
          echo "上一个正式版本 versionCode=$PREV_CODE，本次 versionCode=$VERSION_CODE"
          [ "$VERSION_CODE" -gt "$PREV_CODE" ] || { echo "version_code 必须大于上一个正式版本（$PREV_CODE）"; exit 1; }
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 未配置"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PversionName="${{ inputs.version }}" -PversionCode="${{ inputs.version_code }}" --stacktrace
      - name: Verify signature and checksum
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/wenzhen-practice.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs dist/wenzhen-practice.apk)
          echo "$OUT"
          CERT=$(echo "$OUT" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -n "$EXPECTED_CERT" ]; then test "$CERT" = "$(echo "$EXPECTED_CERT" | tr -d ':' | tr 'A-F' 'a-f')" || { echo "签名证书不一致"; exit 1; }; fi
          echo "APK_CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          (cd dist && sha256sum wenzhen-practice.apk > wenzhen-practice.apk.sha256)
          cat dist/wenzhen-practice.apk.sha256
      - name: Generate update manifest
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          test -n "$APK_CERT_SHA256" || { echo "APK 证书 SHA-256 为空"; exit 1; }
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          version_code = int(os.environ["VERSION_CODE"])
          checksum = Path("dist/wenzhen-practice.apk.sha256").read_text(encoding="utf-8").split()[0].lower()
          notes = os.environ.get("NOTES", "").strip() or f"版本 {version}"
          data = {
              "versionName": version,
              "versionCode": version_code,
              "apkUrl": f"https://github.com/xjb1337/wenzhen-practice/releases/download/v{version}/wenzhen-practice.apk",
              "sha256": checksum,
              "signingCertSha256": os.environ["APK_CERT_SHA256"].lower(),
              "notes": notes,
              "minSdk": 26,
          }
          Path("dist/update.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cat dist/update.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.release_notes }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${{ inputs.version }}"
          TITLE="问诊练习 $TAG"
          printf '%s\n\nSHA-256: `%s`\n' "${NOTES:-版本 ${{ inputs.version }}}" "$(cut -d' ' -f1 dist/wenzhen-practice.apk.sha256)" > "$RUNNER_TEMP/notes.md"
          set +e
          for attempt in 1 2 3 4 5; do
            echo "尝试发布（第 $attempt 次）"
            if gh release create "$TAG" dist/wenzhen-practice.apk dist/wenzhen-practice.apk.sha256 dist/update.json \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest; then
              echo "发布成功"
              exit 0
            fi
            echo "第 $attempt 次发布失败（exit=$?），检查是否有残留 release"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/wenzhen-practice.apk dist/wenzhen-practice.apk.sha256 dist/update.json --clobber
              if gh release view "$TAG" --json assets -q '.assets[] | select(.name == "wenzhen-practice.apk") | .name' | grep -q .; then
                gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest
                echo "补充上传成功"
                exit 0
              fi
              gh release delete "$TAG" --yes --cleanup-tag
            fi
            sleep 15
          done
          echo "发布重试 5 次后仍失败"
          exit 1
