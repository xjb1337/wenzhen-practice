name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Kotlin formatting sanity
        run: |
          if grep -rInP '\t| +$' app/src --include='*.kt'; then
            echo "发现制表符或尾随空格，请先格式化 Kotlin 源码"
            exit 1
          fi

      - name: Dependency vulnerability scan (OSV)
        run: python3 tools/osv_scan.py

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wenzhen-practice-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wenzhen-practice-screenshots
          path: app/build/outputs/roborazzi
          if-no-files-found: warn
          retention-days: 14
